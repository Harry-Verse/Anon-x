<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>DARK ROOM</title>

    <link rel="stylesheet" href="/static/style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- ================= CONNECT PAGE ================= -->

    <section class="connect-page" id="connect-page">

        <div class="room-card">

            <div class="join-badge">
                <span class="lock">🔒</span>
                JOIN THE CONVERSATION
            </div>

            <div class="connect-heading">
                <h1>Enter Room</h1>
                <p>Join an existing room or<br>create your own.</p>
            </div>

            <div class="form-group">

                <label for="username">
                    <span class="cyan">♟</span>
                    USERNAME
                    <small>(OPTIONAL)</small>
                </label>

                <div class="input-wrap">
                    <input
                        type="text"
                        id="username"
                        placeholder="e.g. Harsh"
                        autocomplete="off"
                    >
                    <span class="input-icon">♙</span>
                </div>

            </div>


            <div class="form-group">

                <label for="room">
                    <span class="cyan">#</span>
                    ROOM CODE
                </label>

                <div class="input-wrap">
                    <input
                        type="text"
                        id="room"
                        placeholder="e.g. 192.168.1.1"
                        autocomplete="off"
                    >
                    <span class="input-icon hash">#</span>
                </div>

            </div>


            <div class="random-room-box">

                <div class="random-info">
                    <span class="random-icon">♧</span>

                    <div>
                        <strong>Don't have a room code?</strong>
                        <p>Generate a private random room.</p>
                    </div>
                </div>

                <button
                    type="button"
                    class="random-btn"
                    onclick="generateRoom()"
                >
                    RANDOM ROOM
                </button>

            </div>


            <button
                type="button"
                class="connect-btn"
                onclick="joinRoom()"
            >
                <span>CONNECT TO ROOM</span>
                <span class="arrow">→</span>
            </button>


            <div class="room-note">
                ♙ Anyone using the same room code can join this chat.
            </div>

        </div>

    </section>



    <!-- ================= CHAT PAGE ================= -->

    <section class="chat-page" id="chat-page">

        <!-- TOPBAR -->

        <header class="topbar">

            <div class="brand">

                <div class="brand-icon">
                    ◇
                </div>

                <div class="brand-text">
                    DARK <span>ROOM</span>
                </div>

            </div>


            <div class="room-status">

                <span class="status-dot"></span>

                <span>
                    ROOM //
                    <strong id="room-name"></strong>
                </span>

            </div>


            <button
                class="clearbtn"
                onclick="clearChat()"
            >
                CLEAR CHAT
            </button>

        </header>


        <!-- CONNECTION STATUS -->

        <div class="connection-status">

            <span class="status-line left"></span>

            <span class="status-text">
                ANONYMOUS CONNECTION ESTABLISHED
            </span>

            <span class="status-line right"></span>

        </div>


        <!-- MESSAGES -->

        <main id="messages"></main>


        <!-- MESSAGE INPUT -->

        <div class="chat-input-area">

            <div class="chat-input-box">

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type a message..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    onclick="sendMessage()"
                    id="sendBtn"
                >
                    SEND
                    <span>→</span>
                </button>

            </div>

        </div>

    </section>


    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <script src="/static/script.js"></script>

</body>

</html>
